<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="/style/login-style.css">
  <title>SignUp</title>
</head>
<body>
  <div class="login-container">
    <h1>SignUp</h1>
    <p class="login-intro">Your productivity starts here—simple, secure, and effective.</p>
    
    <form id="signupForm">
      <div class="username">
        <label for="username">User Name</label><br>
        <input type="text" name="username" id="username" required><br>
      </div>

      <div class="email">
        <label for="email">Email</label><br>
        <input type="email" name="email" id="email" required><br>
      </div>

      <div class="password">
        <label for="password">Password</label><br>
        <input type="password" name="password" id="password" required><br>
      </div>

      <div class="confirm-password">
        <label for="confirm-password">Confirm Password</label><br>
        <input type="password" name="confirm-password" id="confirm-password" required><br>
      </div>

      <button type="submit" class="login-btn">SignUp</button>
    </form>

    <div class="extra-links">
      <!-- Point directly to pages/login.html from S3 root -->
      <p>Already have an account? <a href="/pages/login.html">Login</a></p>
    </div>
  </div>

  <!-- Import the signup script as an ES Module -->
  <script type="module" src="../scripts/signup.js"></script>
</body>
</html>
